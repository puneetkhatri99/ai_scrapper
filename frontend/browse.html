<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scarper &middot; browse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">scarper</a>
  <nav>
    <a href="index.html">New job</a>
    <a href="browse.html" aria-current="page">Browse</a>
  </nav>
</header>

<main>
  <div class="card-head">
    <h1 style="margin:0">Browse</h1>
    <button class="ghost" id="refresh" type="button">Refresh</button>
  </div>

  <div class="tabs" role="tablist" aria-label="Tables">
    <button role="tab" id="tab-jobs" data-tab="jobs" aria-selected="true"
            aria-controls="panel">Jobs <span class="count"></span></button>
    <button role="tab" id="tab-attempts" data-tab="attempts" aria-selected="false"
            aria-controls="panel">Attempts <span class="count"></span></button>
    <button role="tab" id="tab-scripts" data-tab="scripts" aria-selected="false"
            aria-controls="panel">Saved scripts <span class="count"></span></button>
  </div>

  <div id="panel" role="tabpanel" aria-labelledby="tab-jobs"></div>
</main>

<script src="api.js"></script>
<script src="browse.js"></script>
</body>
</html>
