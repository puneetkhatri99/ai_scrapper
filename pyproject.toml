[project]
name = "scarper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pymysql",
    "pydantic",
    "httpx",          # the Gemini call in llm/generate.py; also FastAPI's TestClient
    # "anthropic",    # only for the commented Anthropic path in llm/generate.py
    "playwright",
    "langfuse",       # tracing in backend/tracing.py; inert without its keys
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["backend*"]   # backend.jobs, backend.llm, backend.scraping

[tool.pytest.ini_options]
testpaths = ["tests"]
